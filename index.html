<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelScan Pro - SMKA Tok Bachok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .gold-accent { color: #f59e0b; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- HEADER SEKOLAH -->
    <div class="glass-card p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="text-center md:text-left">
        <h1 class="text-xl font-extrabold tracking-wide text-white">SMKA TOK BACHOK</h1>
        <p class="text-xs gold-accent font-medium uppercase tracking-widest mt-1">Sistem Pengurusan Asrama • Pantas & Selamat</p>
      </div>
      <div class="text-xs bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 text-slate-300">
        🕒 <span id="current-time"></span>
      </div>
    </div>

    <!-- PANEL SCANNER & MOD PERGERAKAN -->
    <div class="glass-card p-6 rounded-2xl">
      <div class="flex gap-2 mb-4 p-1 bg-slate-900/80 rounded-xl border border-slate-800">
        <button onclick="tukarMod('MASUK')" id="btn-masuk" class="flex-1 py-2.5 rounded-lg font-bold text-xs transition-all bg-emerald-600 text-white shadow-lg">SCAN MASUK</button>
        <button onclick="tukarMod('KELUAR')" id="btn-keluar" class="flex-1 py-2.5 rounded-lg font-bold text-xs transition-all text-slate-400 hover:text-white">SCAN KELUAR</button>
      </div>

      <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-800 mb-4 bg-black"></div>
      
      <!-- PENGISIAN MANUAL -->
      <div class="pt-4 border-t border-slate-800 flex gap-2">
        <input type="text" id="manual-id" placeholder="Masukkan ID Pelajar (Manual)..." class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
        <button onclick="hantarManual()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md">SIMPAN</button>
      </div>
    </div>

    <!-- STATISTIK KESELURUHAN -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="glass-card p-4 rounded-xl text-center">
        <div class="text-xs text-slate-400 mb-1">JUMLAH PELAJAR</div>
        <div id="stat-total" class="text-xl font-black text-white">0</div>
      </div>
      <div class="glass-card p-4 rounded-xl text-center">
        <div class="text-xs text-emerald-400 mb-1">SUDAH MASUK</div>
        <div id="stat-masuk" class="text-xl font-black text-emerald-400">0</div>
      </div>
      <div class="glass-card p-4 rounded-xl text-center">
        <div class="text-xs text-amber-400 mb-1">KELUAR</div>
        <div id="stat-keluar" class="text-xl font-black text-amber-400">0</div>
      </div>
      <div class="glass-card p-4 rounded-xl text-center">
        <div class="text-xs text-blue-400 mb-1">PERATUS KEHADIRAN</div>
        <div id="stat-peratus" class="text-xl font-black text-blue-400">0%</div>
      </div>
    </div>

    <!-- RINGKASAN TINGKATAN -->
    <div class="glass-card p-5 rounded-2xl">
      <h2 class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-3">RINGKASAN TINGKATAN</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400">
              <th class="p-2">TING.</th>
              <th class="p-2">TOTAL</th>
              <th class="p-2">MASUK</th>
              <th class="p-2">KELUAR</th>
            </tr>
          </thead>
          <tbody id="tabel-tingkatan"></tbody>
        </table>
      </div>
    </div>

    <!-- SEMAK REKOD INDIVIDU -->
    <div class="glass-card p-5 rounded-2xl">
      <h2 class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-3">SEMAK REKOD / SEJARAH INDIVIDU</h2>
      <div class="flex gap-2 mb-3">
        <input type="text" id="cari-individu" placeholder="Masukkan ID atau Nama Pelajar..." class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
        <button onclick="semakIndividu()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 px-5 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md">SEMAK</button>
      </div>
      <div id="hasil-individu" class="text-xs text-slate-300 bg-slate-900/50 p-3 rounded-xl border border-slate-800 hidden">
        <!-- Paparan hasil carian individu akan muncul di sini -->
      </div>
    </div>

    <!-- SENARAI PELAJAR -->
    <div class="glass-card p-5 rounded-2xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
        <h2 class="text-xs font-bold tracking-wider text-slate-400 uppercase">SENARAI STATUS PELAJAR</h2>
        <input type="text" id="cari" onkeyup="tapisJadual()" placeholder="🔍 Cari nama / ID pelajar..." class="w-full md:w-64 bg-slate-900 border border-slate-700 p-2 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
      </div>
      <div class="overflow-x-auto max-h-96 overflow-y-auto">
        <table class="w-full text-left text-xs">
          <thead class="sticky top-0 bg-slate-900/90 backdrop-blur">
            <tr class="border-b border-slate-800 text-slate-400">
              <th class="p-2">Nama Pelajar</th>
              <th class="p-2">Ting / Kelas</th>
              <th class="p-2">Dorm</th>
              <th class="p-2">Status Terakhir</th>
              <th class="p-2">Masa</th>
            </tr>
          </thead>
          <tbody id="jadual-utama"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let statusSemasa = "MASUK";
    const urlAPI = "https://script.google.com/macros/s/AKfycbwwS9WzzyUgszP_vrFEI-mdgXVJmWZ9pZG4SaHWLFl7lJI7iRI56-tjB94XdJO423gnVg/exec"; // ⚠️ GANTIKAN DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    let dataGlobalPelajar = []; // Menyimpan senarai untuk carian individu

    function tukarMod(mod) {
      statusSemasa = mod;
      const btnMasuk = document.getElementById("btn-masuk");
      const btnKeluar = document.getElementById("btn-keluar");
      
      if (mod === "MASUK") {
        btnMasuk.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition-all bg-emerald-600 text-white shadow-lg";
        btnKeluar.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition-all text-slate-400 hover:text-white";
      } else {
        btnKeluar.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition-all bg-red-600 text-white shadow-lg";
        btnMasuk.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition-all text-slate-400 hover:text-white";
      }
    }

    function mulaScanner() {
      new Html5Qrcode("reader").start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (idPelajar) => { hantarData(idPelajar.trim()); },
        (error) => {}
      ).catch(err => console.error("Gagal membuka kamera:", err));
    }

    function hantarData(idPelajar) {
      if (!idPelajar) return;
      fetch(urlAPI, {
        method: "POST",
        body: JSON.stringify({ idPelajar: idPelajar, arahPergerakan: statusSemasa })
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === "SUCCESS") {
          new Audio('https://actions.google.com/sounds/v1/ui/beep.ogg').play().catch(e => {});
          muatData();
        } else {
          alert("Perhatian: " + (res.message || "ID tidak dijumpai"));
        }
      })
      .catch(err => console.error("Ralat rangkaian:", err));
    }

    function hantarManual() {
      const input = document.getElementById("manual-id");
      const id = input.value.trim();
      if (id) { hantarData(id); input.value = ""; }
      else { alert("Sila masukkan ID pelajar terlebih dahulu."); }
    }

    function muatData() {
      const tarikhHariIni = new Date().toISOString().split('T')[0];
      fetch(`${urlAPI}?tarikh=${tarikhHariIni}`)
      .then(res => res.json())
      .then(res => {
        if(res.status !== "SUCCESS") return;
        dataGlobalPelajar = res.belumMasuk || []; // Simpan data untuk rujukan carian individu

        // Update Statistik Keseluruhan
        document.getElementById("stat-total").innerText = res.keseluruhan.total;
        document.getElementById("stat-masuk").innerText = res.keseluruhan.masuk;
        document.getElementById("stat-keluar").innerText = res.keseluruhan.keluar;
        
        let peratus = res.keseluruhan.total > 0 ? ((res.keseluruhan.masuk / res.keseluruhan.total) * 100).toFixed(1) : 0;
        document.getElementById("stat-peratus").innerText = peratus + "%";

        // Update Ringkasan Tingkatan
        const tbodyTingkatan = document.getElementById("tabel-tingkatan");
        tbodyTingkatan.innerHTML = Object.keys(res.tingkatan).map(ting => `
          <tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
            <td class="p-2 font-bold text-white">${ting}</td>
            <td class="p-2 text-slate-300">${res.tingkatan[ting].total}</td>
            <td class="p-2 text-emerald-400 font-semibold">${res.tingkatan[ting].masuk}</td>
            <td class="p-2 text-amber-400 font-semibold">${res.tingkatan[ting].keluar}</td>
          </tr>
        `).join('');

        // Update Senarai Pelajar
        const tbodyUtama = document.getElementById("jadual-utama");
        tbodyUtama.innerHTML = dataGlobalPelajar.map(p => `
          <tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
            <td class="p-2 font-medium text-white">${p.nama}</td>
            <td class="p-2 text-slate-300">${p.tingkatan} ${p.kelas}</td>
            <td class="p-2 text-slate-400">${p.dorm}</td>
            <td class="p-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">${p.statusTerakhir}</span></td>
            <td class="p-2 text-slate-400 text-[11px]">${p.masaTerakhir}</td>
          </tr>
        `).join('');
      })
      .catch(err => console.error("Ralat memuatkan data:", err));
    }

    function semakIndividu() {
      const keyword = document.getElementById("cari-individu").value.trim().toUpperCase();
      const hasilDiv = document.getElementById("hasil-individu");
      if(!keyword) { hasilDiv.classList.add("hidden"); return; }

      const jumpa = dataGlobalPelajar.filter(p => p.nama.toUpperCase().includes(keyword) || p.id.toUpperCase().includes(keyword));
      
      hasilDiv.classList.remove("hidden");
      if(jumpa.length > 0) {
        hasilDiv.innerHTML = jumpa.map(p => `
          <div class="py-1 border-b border-slate-800 last:border-none">
            <b>${p.nama}</b> (${p.tingkatan} ${p.kelas}) - Dorm: ${p.dorm} <br>
            Status Terakhir: <span class="text-amber-400 font-bold">${p.statusTerakhir}</span> pada masa ${p.masaTerakhir}
          </div>
        `).join('');
      } else {
        hasilDiv.innerHTML = "Tiada rekod ditemui untuk carian tersebut.";
      }
    }

    function tapisJadual() {
      const v = document.getElementById("cari").value.toUpperCase();
      document.querySelectorAll('#jadual-utama tr').forEach(r => {
        r.style.display = r.innerText.toUpperCase().includes(v) ? '' : 'none';
      });
    }

    setInterval(() => {
      const now = new Date();
      document.getElementById("current-time").innerText = now.toLocaleDateString('ms-MY') + ' ' + now.toLocaleTimeString('ms-MY');
    }, 1000);

    window.onload = () => {
      mulaScanner();
      muatData();
      setInterval(muatData, 30000);
    };
  </script>
</body>
</html>
